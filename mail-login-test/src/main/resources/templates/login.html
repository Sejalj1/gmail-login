<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mail Test Lab - Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #202124;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 380px;
            background: white;
            border: 1px solid #dadce0;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #4285f4;
            margin-bottom: 10px;
        }

        .demo-label {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #5f6368;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 45px;
            padding: 10px;
            margin-bottom: 20px;

            border: 1px solid #dadce0;
            border-radius: 5px;

            font-size: 15px;
        }

        input:focus {
            outline: none;
            border: 2px solid #4285f4;
        }

        button {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 5px;

            background: #4285f4;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3367d6;
        }

        .error {
            background: #fde8e8;
            color: #b3261e;

            padding: 12px;
            border-radius: 5px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .logout {
            background: #e8f0fe;
            color: #1967d2;

            padding: 12px;
            border-radius: 5px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .test-info {
            margin-top: 25px;
            padding: 15px;

            background: #f8f9fa;
            border-radius: 6px;

            font-size: 13px;
            color: #5f6368;
        }

        .test-info strong {
            color: #202124;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="login-card">

            <div class="logo">
                Gmail
            </div>

            <h1>Sign in</h1>

            <div class="error" th:if="${param.error}">
                Invalid username or password.
            </div>

            <div class="logout" th:if="${param.logout}">
                You have been logged out successfully.
            </div>

            <form method="POST" action="/login">

                <label for="username">
                    Email
                </label>

                <input id="username" name="username" type="email" placeholder="Enter valid email" required>

                <label for="password">
                    Password
                </label>

                <input id="password" name="password" type="password" placeholder="Enter password" required>

                <button type="submit">
                    Sign in
                </button>

            </form>


        </div>

    </div>

</body>

</html>
