<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .header {
            height: 70px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #4285f4;
        }

        .logout {
            background: #4285f4;
            color: white;

            border: none;
            border-radius: 5px;

            padding: 10px 18px;

            cursor: pointer;
        }

        .content {
            max-width: 700px;
            margin: 80px auto;

            background: white;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .success {
            color: #188038;
            font-size: 20px;
        }

    </style>

</head>

<body>

<div class="header">

    <div class="logo">
        Mail Test Lab
    </div>

    <form method="POST" action="/logout">

        <button class="logout" type="submit">
            Logout
        </button>

    </form>

</div>

<div class="content">

    <div class="success">
        Authentication successful!
    </div>

    <p>
        You have successfully authenticated with the
        local test authentication system.
    </p>

    <p>
        This page is protected by Spring Security.
    </p>

</div>

</body>

</html>
